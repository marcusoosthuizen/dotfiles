[audio]
enable_sounds = true

[backdrop]
blur_intensity = 0.0
enabled = true
tint_intensity = 0.0

[bar.default]
capsule = true
center = [ "media", "clock", "weather" ]
concave_edge_corners = false
end = [ "tray", "cpu", "notifications", "volume", "network", "battery" ]
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
scale = 1.2000000104308128
shadow = false
start = [ "workspaces", "active_window" ]
thickness = 42

[battery]
warning_threshold = 20

[control_center]
sidebar = "none"
sidebar_section = "none"

    [control_center.calendar]
    show_events_card = false

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 982.0
    enabled = false
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 768.0
    cy = 480.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 368.0
    box_width = 368.0
    cx = 960.0
    cy = 460.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "sticker"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        image_path = "/var/home/marcus/.torchic.gif"
        opacity = 1.0

[nightlight]
enabled = true

[notification]
scale = 0.90000000596046448

[osd]
position = "bottom_center"

    [osd.kinds]
    lock_keys = false
    volume_input = false

[shell]
clipboard_enabled = false
external_ip_enabled = true
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true

    [shell.animation]
    enabled = true

    [shell.launcher]
    categories = false
    compact = true

    [shell.panel]
    open_near_click_control_center = true
    wallpaper_placement = "floating"
    wallpaper_position = "center"

[theme]
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "foot", "gtk3", "gtk4", "kcolorscheme", "niri", "qt", "starship" ]
    community_ids = [ "feishin", "zen-browser", "discord", "gimp", "obsidian", "zed", "prismlauncher", "steam", "obs" ]

[wallpaper.default]
path = "/usr/share/backgrounds/steins.png"

[wallpaper.last]
path = "/usr/share/backgrounds/steins.png"

[widget.active_window]
icon_size = 16
scale = 0.90000000000000013

[widget.battery]
scale = 0.90000000000000013

[widget.clock]
format = "{:%I:%M:%S %p  •  %a %d}"
scale = 0.90000000000000013

[widget.cpu]
scale = 0.90000000000000013

[widget.media]
scale = 0.90000000000000013

[widget.network]
scale = 0.90000000000000013
show_label = false

[widget.notifications]
scale = 0.90000000000000013

[widget.tray]
scale = 0.90000000000000013

[widget.volume]
scale = 0.90000000000000013

[widget.weather]
scale = 0.90000000000000013
show_condition = false

[widget.workspaces]
empty_color = "surface_variant"
inactive_pill_size = 1.6000000000000001
occupied_color = "outline"
pill_scale = 0.75
show_labels = false
