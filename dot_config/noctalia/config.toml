[audio]
enable_sounds = true

[bar.default]
capsule = true
center = [ "media", "clock", "weather" ]
concave_edge_corners = false
end = [ "tray", "cpu", "notifications", "volume", "network", "battery" ]
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
start = [ "workspaces", "active_window" ]

[battery]
warning_threshold = 20

[control_center]
sidebar = "none"
sidebar_section = "none"

    [control_center.calendar]
    show_events_card = false

[desktop_widgets]
enabled = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 564.0
    cy = 376.0
    output = "eDP-1"
    placement_height = 752.0
    placement_width = 1128.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

[notification]
scale = 0.90000000596046448

[osd]
position = "bottom_center"

[shell]
clipboard_enabled = false
external_ip_enabled = true
password_style = "random"
polkit_agent = true

    [shell.animation]
    enabled = false

    [shell.launcher]
    categories = false
    compact = true

    [shell.panel]
    open_near_click_control_center = true
    wallpaper_placement = "floating"
    wallpaper_position = "center"

[theme]
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "foot", "gtk3", "gtk4", "helix", "kcolorscheme", "qt", "starship", "sway" ]
    community_ids = [ "pywalfox", "steam", "obs", "lazygit" ]

[wallpaper.default]
path = "/usr/share/backgrounds/steins.png"

[wallpaper.last]
path = "/usr/share/backgrounds/steins.png"

[widget.active_window]
icon_size = 16
scale = 0.90000000000000013

[widget.battery]
scale = 0.90000000000000013

[widget.clock]
format = "{:%I:%M:%S %p  •  %a %d}"
scale = 0.90000000000000013

[widget.cpu]
scale = 0.90000000000000013

[widget.media]
scale = 0.90000000000000013

[widget.network]
scale = 0.90000000000000013
show_label = false

[widget.notifications]
scale = 0.90000000000000013

[widget.tray]
scale = 0.90000000000000013

[widget.volume]
scale = 0.90000000000000013

[widget.weather]
scale = 0.90000000000000013
show_condition = false

[widget.workspaces]
inactive_pill_size = 1.6000000000000001
occupied_color = "outline"
pill_scale = 0.75
show_labels = false
